<div class="page">
  <h2>{{ title }}</h2>

  <ng-container *ngIf="!loading && !error; else state">
    <div *ngFor="let r of items" class="card">
      <div class="thumb"></div>

      <div class="main">
        <div class="name">{{ r.name }}</div>
        <div class="desc">{{ r.description }}</div>
      </div>

      <div class="side">
        <div class="row"><span class="label">Status</span><span class="value">{{ r.status }}</span></div>
        <div class="row"><span class="label">Location</span><span class="value">{{ r.location }}</span></div>
        <div class="row">
          <span class="label">Open until</span>
          <span class="value">{{ openUntil(r.createdAt) | date:'dd.MM.yyyy.' }}</span>
        </div>
        <a class="more" (click)="more(r.id)">More…</a>
      </div>
    </div>

    <p *ngIf="items.length === 0" class="empty">No requests to show.</p>
  </ng-container>

  <ng-template #state>
    <p *ngIf="loading">Loading…</p>
    <p *ngIf="!loading && error" class="err">{{ error }}</p>
  </ng-template>
</div>
