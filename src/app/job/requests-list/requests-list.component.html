<div class="page">
  <h2>{{ title }}</h2>

  <ng-container *ngIf="!loading && !error; else state">
    <div *ngFor="let r of items" class="card">

      <div class="main">
        <div class="name">{{ r.name }}</div>
        <div class="desc">{{ r.description }}</div>
      </div>

      <div class="side">
        <div class="row">
          <span class="label"><i class="fa-solid fa-circle-info"></i> Status</span>
          <span class="value status-badge" [style.color]="getStatusColor(r.status)">
            <i [class]="getStatusIcon(r.status)"></i> {{ r.status }}
          </span>
        </div>
        <div class="row">
          <span class="label"><i class="fa-solid fa-location-dot"></i> Location</span>
          <span class="value">{{ r.location }}</span>
        </div>
        <div class="row">
          <span class="label"><i class="fa-solid fa-calendar-days"></i> Open until</span>
          <span class="value">{{ openUntil(r.createdAt) | date:'dd.MM.yyyy.' }}</span>
        </div>
        <a class="more" (click)="more(r.id)">
          <i class="fa-solid fa-arrow-right"></i> More
        </a>
      </div>
    </div>

    <p *ngIf="items.length === 0" class="empty">No requests to show.</p>
  </ng-container>

  <ng-template #state>
    <p *ngIf="loading">Loading…</p>
    <p *ngIf="!loading && error" class="err">{{ error }}</p>
  </ng-template>
</div>
