<div class="page" *ngIf="!loading && !error; else state">
  <h2>Job Postings</h2>

  <p *ngIf="groupedByPosting.length === 0" class="empty">No active job postings with applications.</p>

  <div class="card" *ngFor="let g of groupedByPosting">

    <div class="main">
      <div class="name">{{ g.requestName }}</div>
      <div class="desc">{{ g.requestDescription }}</div>
    </div>

    <div class="side">
      <div class="row">
        <span class="label"><i class="fa-solid fa-location-dot"></i> Location</span>
        <span class="value">{{ g.requestLocation || '—' }}</span>
      </div>
      <div class="row">
        <span class="label"><i class="fa-solid fa-calendar-days"></i> Open until</span>
        <span class="value">{{ g.openUntil ? (g.openUntil | date:'dd.MM.yyyy.') : '—' }}</span>
      </div>
      <div class="row">
        <span class="label"><i class="fa-solid fa-users"></i> Applicants</span>
        <span class="value"><span class="count-badge">{{ g.count }}</span></span>
      </div>
      <button class="more" (click)="viewPosting(g)">
        <i class="fa-solid fa-arrow-right"></i> View applicants
      </button>
    </div>
  </div>
</div>

<ng-template #state>
  <p *ngIf="loading" class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</p>
  <p *ngIf="!loading && error" class="err">{{ error }}</p>
</ng-template>
