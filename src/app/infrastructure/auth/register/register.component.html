<div class="register-container">
  <h2>Register</h2>
  <form (ngSubmit)="register()">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="email" name="email" required />
      <div *ngIf="emailError" class="error-message">Please enter a valid email address.</div>
    </div>

   <!-- <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" [(ngModel)]="username" name="username" required minlength="3" />
      <div *ngIf="usernameError" class="error-message">Username must be at least 3 characters long.</div>
    </div>-->

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="password" name="password" required minlength="6" />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required />
      <div *ngIf="passwordMismatchError" class="error-message">Passwords do not match.</div>
    </div>

    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" [(ngModel)]="firstName" name="firstName" required />
    </div>
    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" [(ngModel)]="lastName" name="lastName" required />
    </div>
    <div class="form-group">
      <label for="phone">Phone number</label>
      <input 
        type="text" 
        id="phone" 
        [(ngModel)]="phone" 
        name="phone" 
        required 
        pattern="^[0-9]*$"
        #phoneCtrl="ngModel"
      />
      <div *ngIf="phoneCtrl.invalid && phoneCtrl.touched" class="error-message">
        Phone number can only contain digits.
      </div>
    </div>

    <!-- NEW: CV upload -->
    <div class="form-group">
      <label for="cv">CV (PDF/DOC/DOCX)</label>
      <input type="file" id="cv" name="cv" (change)="onFileSelected($event)"
             accept=".pdf,.doc,.docx,.odt" />
      <div *ngIf="cvError" class="error-message">{{ cvError }}</div>
    </div>

    <button type="submit" class="register-button">Register</button>
  </form>

  <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

  <p class="login-link">
    Already have an account? <a routerLink="/login">Log in</a>
  </p>
</div>
